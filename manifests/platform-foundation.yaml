id: platform-foundation
kind: platform-base
owner: platform-core
description: Non-removable foundation shared by every styio-platform business capability.
split_policy:
  extractable: false
  reason: Provides process, system, storage, security, protocol, and service primitives used by every business.
cmake_targets:
  - styio_platform_system
  - styio_platform_core
  - styio_platform_security
  - styio_platform_storage
  - styio_platform_protocols
  - styio_platform_service
  - styio_platform_kernel
modules:
  core:
    - src/PlatformCore/Config.*
    - src/PlatformCore/Core
    - src/PlatformCore/System
    - src/PlatformCore/Manifest
    - src/PlatformCore/RegistryClient
    - src/PlatformCore/Resolve
    - src/PlatformCore/SourceFetch
    - src/PlatformCore/Toolchain
  storage:
    - src/PlatformStorage/PlatformCache
    - src/PlatformStorage/PlatformPersistence
    - src/PlatformStorage/PlatformRecovery
  security:
    - src/PlatformSecurity/ExternalIdentity
    - src/PlatformSecurity/PlatformCA
    - src/PlatformSecurity/PlatformClientAuth
    - src/PlatformSecurity/SecurityHardening
  protocols:
    - src/SpioPlatformProtocols
  service_base:
    - src/PlatformService
    - src/PlatformService/RouteCatalog.*
    - src/PlatformService/RouterSupport.hpp
    - src/PlatformService/PlatformOps
contracts:
  service_runtime:
    - health
    - route_dispatch
    - mtls_identity_extraction
    - public_config_serialization
storage:
  persistence:
    - memory_state_store
    - postgres_state_store
    - object_store
  cache:
    - local_cache_paths
  recovery:
    - filesystem_snapshot
    - snapshot_restore
security:
  primitives:
    - external_identity_mapping
    - local_ca_lifecycle
    - mtls_client_identity
    - operation_authorization
operations:
  production_readiness:
    - recovery_snapshot
    - recovery_restore
    - rate_limit
    - audit_query
    - metrics
    - storage_status
runtime_adapters:
  operating_system:
    - filesystem
    - process
    - tcp
invariants:
  - Foundation code must not own product-specific state machines.
  - Business capabilities may depend on foundation, but foundation must not depend on business capabilities.
  - Service extraction must preserve these APIs as the common platform base.
